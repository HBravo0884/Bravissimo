[build]
  command = "npm run build"
  publish = "dist"

# The one server: /api/* talks to Notion with NOTION_TOKEN, NOTION_ROOT_PAGE and STUDIO_KEY.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
